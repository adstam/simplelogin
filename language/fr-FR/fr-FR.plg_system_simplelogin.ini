PLG_SYSTEM_SIMPLELOGIN_FIELDSET_LOGGING_DESCRIPTION="Toutes les données pertinentes des parcours sont enregistrées dans la table de journalisation. Lorsque le mode Debug de Joomla est actif, les informations de débogage sont également enregistrées.<br>Utilisez le bouton « Exporter le journal » pour exporter la journalisation. Le journal est envoyé par e-mail au compte d'administration."

