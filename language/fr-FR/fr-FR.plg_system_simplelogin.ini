PLG_SYSTEM_SIMPLELOGIN_FIELDSET_SESSIONS_DESCRIPTION="Contenu de l'onglet de limitation. Toutes les données de flux y sont enregistrées pour traitement. Lors d'une connexion valide, d'un enregistrement valide ou d'une tentative d'enregistrement avec un lien expiré, un nettoyage de la table est effectué pour les enregistrements plus anciens que la période de conservation."
PLG_SYSTEM_SIMPLELOGIN_FIELDSET_LOGGING="Journalisation"
PLG_SYSTEM_SIMPLELOGIN_FIELDSET_LOGGING_DESCRIPTION="Dans la table de journalisation, toutes les données pertinentes des flux sont enregistrées. Si le mode Debug de Joomla est activé, les informations de débogage sont également enregistrées.<br>Utilisez le bouton 'Exporter le journal' pour exporter la journalisation. Le journal est envoyé par e-mail au compte d'administration."

